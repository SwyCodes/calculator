<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="box" id="layout">
        <input type="text" id="display" readonly>
           
        <div class="box" id="button">
           <button class="btn" id="A">C</button>
           <button class="btn" id="B"><-</button>
           <button class="btn" id="C">%</button>
           <button class="btn" id="D">^</button>
           <button class="btn" id="E">7</button>
           <button class="btn" id="F">8</button>
           <button class="btn" id="G">9</button>
           <button class="btn" id="H">/</button>
           <button class="btn" id="I">4</button>
           <button class="btn" id="J">5</button>
           <button class="btn" id="K">6</button>
           <button class="btn" id="L">*</button>
           <button class="btn" id="M">1</button>
           <button class="btn" id="N">2</button>
           <button class="btn" id="O">3</button>
           <button class="btn" id="P">-</button>
           <button class="btn" id="Q">0</button>
           <button class="btn" id="R">.</button>
           <button class="btn" id="S">=</button>
           <button class="btn" id="T">+</button>
        </div>
    </div>
    
    <script src="calculator.js"></script>
</body>
</html>
